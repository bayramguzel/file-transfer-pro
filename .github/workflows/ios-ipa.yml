name: iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # packages/file_picker bir git submodule olarak tutuluyor
          submodules: recursive

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sürüm bilgisi
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Bağımlılıkları yükle
        run: flutter pub get

      - name: iOS derlemesi (imzasız)
        run: flutter build ios --release --no-codesign

      - name: IPA paketle
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app bulunamadı: $APP_PATH"
            exit 1
          fi
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qry Runner-unsigned.ipa Payload
          ls -lh Runner-unsigned.ipa

      - name: IPA yükle
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-ipa
          path: build/ipa/Runner-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
