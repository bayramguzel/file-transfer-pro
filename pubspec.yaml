name: filetransfer
description: Professional local file transfer via Wi-Fi - File Transfer Pro
publish_to: 'none'
version: 1.4.9+39

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  provider: ^6.1.1
  equatable: ^2.0.5

  # Networking
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  network_info_plus: ^7.0.0
  connectivity_plus: ^7.0.0
  dio: ^5.4.0
  url_launcher: ^6.2.1
  multicast_dns: ^0.3.2+4

  # File Operations
  file_picker:
    path: packages/file_picker
  path_provider: ^2.1.1
  open_filex: ^4.3.4
  permission_handler: ^12.0.1
  mime: ^2.0.0
  archive: ^4.0.9

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

  # UI Components
  dotted_border: ^3.1.0
  video_player: ^2.8.2

  # Database
  drift: ^2.29.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.8.3

  # Storage
  shared_preferences: ^2.2.2

  # Internationalization
  intl: 0.20.2
  flutter_localizations:
    sdk: flutter

  # Utils
  uuid: ^4.2.2
  device_apps: ^2.2.0
  receive_sharing_intent: ^1.8.1
  crypto: ^3.0.3
  image_picker: ^1.2.1
  flutter_local_notifications: ^21.0.0
  wakelock_plus: ^1.4.0
  google_mobile_ads: ^8.0.0
  unity_ads_plugin: ^0.4.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/splash.mp4
    - assets/logo.png

flutter_gen:
  output: lib/gen/
  line_length: 80

flutter_intl:
  enabled: true
  class_name: S
  main_locale: tr
  arb_dir: lib/l10n
  output_dir: lib/generated

